<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标准文件管理子模块</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' },
                        sidebar: { bg:'#e8f4fd', hover:'#d0e8f7', active:'#b8dcf1', text:'#1e3a5f', border:'#c5dff0' }
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background: linear-gradient(135deg, #f0f7ff 0%, #f5f3ff 50%, #fef3f2 100%); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c5d5e4; border-radius: 3px; }
        .sidebar { background: linear-gradient(180deg, #e8f4fd 0%, #d6ecfa 100%); }
        .nav-item { transition: all .25s ease; border-left: 3px solid transparent; }
        .nav-item:hover { background: rgba(59,130,246,.08); border-left-color: #93c5fd; }
        .nav-item.active { background: rgba(59,130,246,.12); border-left-color: #3b82f6; color: #1d4ed8; font-weight: 600; }
        .nav-sub-item { transition: all .2s ease; }
        .nav-sub-item:hover { color: #2563eb; background: rgba(59,130,246,.06); }
        .nav-sub-item.active { color: #1d4ed8; font-weight: 500; }
        .glass-card { background: rgba(255,255,255,.88); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.6); box-shadow: 0 4px 24px rgba(0,0,0,.04); transition: all .3s ease; }
        .glass-card:hover { box-shadow: 0 8px 40px rgba(0,0,0,.08); transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg,#3b82f6,#2563eb); transition: all .25s ease; }
        .btn-primary:hover { background: linear-gradient(135deg,#2563eb,#1d4ed8); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,99,235,.3); }
        .tag { transition: all .2s ease; }
        .tag:hover { transform: scale(1.05); }
        .data-table tr { transition: background .15s ease; }
        .data-table tbody tr:hover { background: #f8fafc; }
        .tab-item { transition: all .25s ease; position: relative; }
        .tab-item::after { content:''; position:absolute; bottom:0; left:50%; width:0; height:2px; background:#3b82f6; transition:all .25s ease; transform:translateX(-50%); }
        .tab-item.active::after { width:80%; }
        .tab-item.active { color:#2563eb; font-weight:600; }
        .search-glow:focus-within { box-shadow:0 0 0 3px rgba(59,130,246,.15); border-color:#93c5fd; }
        .tree-node { transition: all .2s ease; cursor: pointer; }
        .tree-node:hover { background: #f0f7ff; }
        .tree-children { overflow: hidden; transition: max-height .35s ease, opacity .25s ease; }
        .video-card { transition: all .3s ease; }
        .video-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,.1); }
        .video-card .play-btn { transition: all .25s ease; opacity:.85; }
        .video-card:hover .play-btn { opacity:1; transform:scale(1.1); }
        .faq-item { transition: all .2s ease; }
        .faq-item:hover { background: #fafbfc; }
        .status-active { background:#dcfce7; color:#166534; }
        .status-expired { background:#fef3c7; color:#92400e; }
        .status-draft { background:#f1f5f9; color:#475569; }
        .page-section { display: none; }
        .page-section.active { display: block; }
        .sub-section { display: none; }
        .sub-section.active { display: block; }
        .interpret-content { display: none; }
        .interpret-content.active { display: block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .fade-in { animation: fadeIn .3s ease; }
        @keyframes pulse-badge { 0%,100% { opacity:1; } 50% { opacity:.7; } }
        .badge-pulse { animation: pulse-badge 2s infinite; }
        .modal-overlay { transition: opacity .3s ease; }
        .modal-panel { transition: transform .3s ease, opacity .3s ease; }
        .tooltip-w { position:relative; }
        .tooltip-w .tip { visibility:hidden; opacity:0; position:absolute; z-index:50; bottom:100%; left:50%; transform:translateX(-50%); padding:4px 10px; background:#1e293b; color:#fff; font-size:11px; border-radius:6px; white-space:nowrap; transition:all .2s ease; margin-bottom:6px; }
        .tooltip-w:hover .tip { visibility:visible; opacity:1; }
        .clause-item.selected { border-color:#93c5fd; background:rgba(59,130,246,.06); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <template id="legacy">

<!-- ========== LEFT SIDEBAR ========== -->
<aside class="sidebar w-60 min-h-screen flex-shrink-0 border-r border-sidebar-border fixed left-0 top-0 bottom-0 z-30 flex flex-col">
    <div class="px-5 py-5 border-b border-sidebar-border">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-md">
                <i class="fas fa-file-shield text-white text-sm"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold text-sidebar-text leading-tight">标准文件管理</h1>
                <p class="text-[10px] text-sidebar-text/60 mt-0.5">Standard Document Hub</p>
            </div>
        </div>
    </div>
    <nav class="flex-1 py-3 overflow-y-auto" id="sidebarNav">
        <div class="px-4 mb-2"><span class="text-[10px] font-semibold text-sidebar-text/40 uppercase tracking-widest">功能模块</span></div>
        <div class="mb-1">
            <div class="nav-item active flex items-center gap-3 px-5 py-2.5" data-page="file-storage" onclick="switchPage('file-storage',this)">
                <i class="fas fa-folder-tree text-blue-500 w-4 text-center text-sm"></i>
                <span class="text-[13px] text-sidebar-text">标准文件分类存储</span>
            </div>
            <div class="pl-12 space-y-0.5 mt-0.5" id="sub-nav-file-storage">
                <div class="nav-sub-item active py-1.5 px-3 rounded-md text-xs text-sidebar-text/70 cursor-pointer" data-sub="tree-view" onclick="switchSub('tree-view',this,'file-storage')">文件体系管理</div>
                <div class="nav-sub-item py-1.5 px-3 rounded-md text-xs text-sidebar-text/70 cursor-pointer" data-sub="version-mgmt" onclick="switchSub('version-mgmt',this,'file-storage')">版本管理</div>
                <div class="nav-sub-item py-1.5 px-3 rounded-md text-xs text-sidebar-text/70 cursor-pointer" data-sub="relation-config" onclick="switchSub('relation-config',this,'file-storage')">关联配置</div>
            </div>
        </div>
        <div class="mb-1">
            <div class="nav-item flex items-center gap-3 px-5 py-2.5" data-page="file-search" onclick="switchPage('file-search',this)">
                <i class="fas fa-magnifying-glass text-emerald-500 w-4 text-center text-sm"></i>
                <span class="text-[13px] text-sidebar-text">标准文件精准检索</span>
            </div>
        </div>
        <div class="mb-1">
            <div class="nav-item flex items-center gap-3 px-5 py-2.5" data-page="interpret" onclick="switchPage('interpret',this)">
                <i class="fas fa-play-circle text-purple-500 w-4 text-center text-sm"></i>
                <span class="text-[13px] text-sidebar-text">标准解读服务</span>
            </div>
            <div class="pl-12 space-y-0.5 mt-0.5 hidden" id="sub-nav-interpret">
                <div class="nav-sub-item active py-1.5 px-3 rounded-md text-xs text-sidebar-text/70 cursor-pointer" data-sub="video" onclick="switchInterpretSub('video',this)">视频解读</div>
                <div class="nav-sub-item py-1.5 px-3 rounded-md text-xs text-sidebar-text/70 cursor-pointer" data-sub="article" onclick="switchInterpretSub('article',this)">图文解读</div>
                <div class="nav-sub-item py-1.5 px-3 rounded-md text-xs text-sidebar-text/70 cursor-pointer" data-sub="related" onclick="switchInterpretSub('related',this)">关联匹配</div>
            </div>
        </div>
        <div class="mb-1">
            <div class="nav-item flex items-center gap-3 px-5 py-2.5" data-page="faq" onclick="switchPage('faq',this)">
                <i class="fas fa-circle-question text-amber-500 w-4 text-center text-sm"></i>
                <span class="text-[13px] text-sidebar-text">常见问题库</span>
            </div>
        </div>
    </nav>
    <div class="px-5 py-3 border-t border-sidebar-border">
        <div class="flex items-center gap-2 text-[10px] text-sidebar-text/50"><i class="fas fa-shield-halved"></i><span>工业互联网平台标准管理</span></div>
    </div>
</aside>

<!-- ========== MAIN CONTENT ========== -->
<main class="flex-1 ml-60 min-h-screen">
    <!-- Top Header -->
    <header class="sticky top-0 z-20 bg-white/70 backdrop-blur-xl border-b border-gray-100 px-8 py-3">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 text-sm text-gray-500" id="breadcrumb">
                <span class="cursor-pointer hover:text-blue-600">首页</span>
                <i class="fas fa-chevron-right text-[10px] text-gray-300"></i>
                <span class="cursor-pointer hover:text-blue-600">标准文件管理</span>
                <i class="fas fa-chevron-right text-[10px] text-gray-300"></i>
                <span class="text-gray-800 font-medium" id="breadcrumb-current">标准文件分类存储</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="relative">
                    <input type="text" placeholder="全局搜索..." class="w-52 pl-9 pr-4 py-2 text-sm rounded-xl border border-gray-200 focus:outline-none focus:border-blue-300 focus:ring-2 focus:ring-blue-50 bg-gray-50/50 transition-all">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                </div>
                <div class="tooltip-w">
                    <button class="w-8 h-8 rounded-lg bg-gray-50 hover:bg-gray-100 flex items-center justify-center transition-all relative">
                        <i class="fas fa-bell text-gray-500 text-sm"></i>
                        <span class="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 bg-red-500 rounded-full text-[8px] text-white flex items-center justify-center badge-pulse">3</span>
                    </button>
                    <span class="tip">3条新通知</span>
                </div>
                <div class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 rounded-lg px-2 py-1 transition-all">
                    <div class="w-7 h-7 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center">
                        <i class="fas fa-user text-white text-[10px]"></i>
                    </div>
                    <span class="text-sm text-gray-700">管理员</span>
                </div>
            </div>
        </div>
    </header>

    <div class="p-8">

    <!-- ==================== PAGE 1: 标准文件分类存储 ==================== -->
    <section id="page-file-storage" class="page-section active fade-in">
        <div class="mb-6 flex items-center justify-between">
            <div>
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2"><span class="w-1 h-6 bg-blue-500 rounded-full"></span>标准文件分类存储</h2>
                <p class="text-sm text-gray-500 mt-1 ml-3">构建"国家-地方-行业"三级标准文件体系</p>
            </div>
            <div class="flex items-center gap-3">
                <button class="flex items-center gap-2 px-4 py-2 text-sm text-gray-600 border border-gray-200 rounded-xl hover:bg-gray-50 transition-all"><i class="fas fa-download"></i> 批量导出</button>
                <button class="btn-primary flex items-center gap-2 px-4 py-2 text-sm text-white rounded-xl shadow-md" onclick="openModal('uploadModal')"><i class="fas fa-plus"></i> 上传文件</button>
            </div>
        </div>
        <!-- Stats -->
        <div class="grid grid-cols-4 gap-4 mb-6">
            <div class="glass-card rounded-2xl p-4"><div class="flex items-center justify-between"><div><p class="text-xs text-gray-500 mb-1">文件总量</p><p class="text-2xl font-bold text-gray-800">1,286</p><p class="text-[11px] text-emerald-600 mt-1"><i class="fas fa-arrow-up"></i> 较上月 +23</p></div><div class="w-11 h-11 rounded-xl bg-blue-50 flex items-center justify-center"><i class="fas fa-file-lines text-blue-500 text-lg"></i></div></div></div>
            <div class="glass-card rounded-2xl p-4"><div class="flex items-center justify-between"><div><p class="text-xs text-gray-500 mb-1">国家标准</p><p class="text-2xl font-bold text-gray-800">438</p><p class="text-[11px] text-blue-600 mt-1"><i class="fas fa-building-columns"></i> 占比 34%</p></div><div class="w-11 h-11 rounded-xl bg-red-50 flex items-center justify-center"><i class="fas fa-landmark text-red-400 text-lg"></i></div></div></div>
            <div class="glass-card rounded-2xl p-4"><div class="flex items-center justify-between"><div><p class="text-xs text-gray-500 mb-1">地方标准</p><p class="text-2xl font-bold text-gray-800">512</p><p class="text-[11px] text-purple-600 mt-1"><i class="fas fa-map-location-dot"></i> 覆盖 31 省份</p></div><div class="w-11 h-11 rounded-xl bg-purple-50 flex items-center justify-center"><i class="fas fa-map text-purple-400 text-lg"></i></div></div></div>
            <div class="glass-card rounded-2xl p-4"><div class="flex items-center justify-between"><div><p class="text-xs text-gray-500 mb-1">行业标准</p><p class="text-2xl font-bold text-gray-800">336</p><p class="text-[11px] text-amber-600 mt-1"><i class="fas fa-industry"></i> 涵盖 12 领域</p></div><div class="w-11 h-11 rounded-xl bg-amber-50 flex items-center justify-center"><i class="fas fa-industry text-amber-400 text-lg"></i></div></div></div>
        </div>

        <!-- Sub: tree-view -->
        <div id="sub-tree-view" class="sub-section active fade-in">
            <div class="grid grid-cols-12 gap-6">
                <div class="col-span-4">
                    <div class="glass-card rounded-2xl p-5">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-sm font-semibold text-gray-700">三级标准文件体系</h3>
                            <button class="text-xs text-blue-600 hover:text-blue-700" onclick="expandAllTree()"><i class="fas fa-expand-alt mr-1"></i>全部展开</button>
                        </div>
                        <div class="space-y-1" id="fileTree">
                            <!-- 国家标准 -->
                            <div>
                                <div class="tree-node flex items-center gap-2 px-3 py-2 rounded-lg bg-blue-50/50" onclick="toggleTree(this)">
                                    <i class="fas fa-chevron-down text-[10px] text-blue-400 transition-transform duration-200 w-3"></i>
                                    <i class="fas fa-landmark text-red-400 text-sm"></i>
                                    <span class="text-sm font-medium text-gray-700">国家标准</span>
                                    <span class="ml-auto text-[11px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">438</span>
                                </div>
                                <div class="tree-children pl-5 mt-1 space-y-0.5" style="max-height:500px;opacity:1">
                                    <div><div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg" onclick="toggleTree(this)"><i class="fas fa-chevron-right text-[10px] text-gray-400 transition-transform duration-200 w-3"></i><i class="fas fa-folder text-blue-400 text-xs"></i><span class="text-[13px] text-gray-600">工业互联网平台分类分级</span><span class="ml-auto text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full">156</span></div>
                                    <div class="tree-children pl-5 space-y-0.5" style="max-height:0;opacity:0;overflow:hidden">
                                        <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-blue-50"><i class="fas fa-file-pdf text-red-400 text-xs w-3"></i><span class="text-xs text-gray-600 truncate">GB/T 42021-2023 分类分级指南</span></div>
                                        <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-blue-50"><i class="fas fa-file-pdf text-red-400 text-xs w-3"></i><span class="text-xs text-gray-600 truncate">GB/T 40118-2021 应用实施指南</span></div>
                                        <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-blue-50"><i class="fas fa-file-pdf text-red-400 text-xs w-3"></i><span class="text-xs text-gray-600 truncate">GB/T 41870-2022 智能制造通用要求</span></div>
                                    </div></div>
                                    <div><div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg" onclick="toggleTree(this)"><i class="fas fa-chevron-right text-[10px] text-gray-400 transition-transform duration-200 w-3"></i><i class="fas fa-folder text-blue-400 text-xs"></i><span class="text-[13px] text-gray-600">服务能力评估标准</span><span class="ml-auto text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full">98</span></div>
                                    <div class="tree-children pl-5 space-y-0.5" style="max-height:0;opacity:0;overflow:hidden">
                                        <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-blue-50"><i class="fas fa-file-pdf text-red-400 text-xs w-3"></i><span class="text-xs text-gray-600 truncate">GB/T 39116-2020 信息技术服务评估</span></div>
                                    </div></div>
                                    <div><div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg" onclick="toggleTree(this)"><i class="fas fa-chevron-right text-[10px] text-gray-400 transition-transform duration-200 w-3"></i><i class="fas fa-folder text-blue-400 text-xs"></i><span class="text-[13px] text-gray-600">安全防护标准</span><span class="ml-auto text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full">72</span></div>
                                    <div class="tree-children pl-5 space-y-0.5" style="max-height:0;opacity:0;overflow:hidden">
                                        <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-blue-50"><i class="fas fa-file-pdf text-red-400 text-xs w-3"></i><span class="text-xs text-gray-600 truncate">GB/T 37024-2018 信息安全技术</span></div>
                                    </div></div>
                                </div>
                            </div>
                            <!-- 地方标准 -->
                            <div>
                                <div class="tree-node flex items-center gap-2 px-3 py-2 rounded-lg" onclick="toggleTree(this)">
                                    <i class="fas fa-chevron-right text-[10px] text-gray-400 transition-transform duration-200 w-3"></i>
                                    <i class="fas fa-map text-purple-400 text-sm"></i>
                                    <span class="text-sm font-medium text-gray-700">地方标准</span>
                                    <span class="ml-auto text-[11px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full">512</span>
                                </div>
                                <div class="tree-children pl-5 mt-1 space-y-0.5" style="max-height:0;opacity:0;overflow:hidden">
                                    <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg"><i class="fas fa-folder text-purple-400 text-xs w-3"></i><span class="text-[13px] text-gray-600">广东省实施细则 (86)</span></div>
                                    <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg"><i class="fas fa-folder text-purple-400 text-xs w-3"></i><span class="text-[13px] text-gray-600">浙江省实施细则 (73)</span></div>
                                    <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg"><i class="fas fa-folder text-purple-400 text-xs w-3"></i><span class="text-[13px] text-gray-600">山东省实施细则 (64)</span></div>
                                    <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg"><i class="fas fa-folder text-purple-400 text-xs w-3"></i><span class="text-[13px] text-gray-600">江苏省实施细则 (58)</span></div>
                                </div>
                            </div>
                            <!-- 行业标准 -->
                            <div>
                                <div class="tree-node flex items-center gap-2 px-3 py-2 rounded-lg" onclick="toggleTree(this)">
                                    <i class="fas fa-chevron-right text-[10px] text-gray-400 transition-transform duration-200 w-3"></i>
                                    <i class="fas fa-industry text-amber-400 text-sm"></i>
                                    <span class="text-sm font-medium text-gray-700">行业标准</span>
                                    <span class="ml-auto text-[11px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">336</span>
                                </div>
                                <div class="tree-children pl-5 mt-1 space-y-0.5" style="max-height:0;opacity:0;overflow:hidden">
                                    <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg"><i class="fas fa-folder text-amber-400 text-xs w-3"></i><span class="text-[13px] text-gray-600">YD/T 通信行业标准 (124)</span></div>
                                    <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg"><i class="fas fa-folder text-amber-400 text-xs w-3"></i><span class="text-[13px] text-gray-600">QC/T 汽车行业标准 (89)</span></div>
                                    <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg"><i class="fas fa-folder text-amber-400 text-xs w-3"></i><span class="text-[13px] text-gray-600">JB/T 机械行业标准 (67)</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Right File List -->
                <div class="col-span-8">
                    <div class="glass-card rounded-2xl p-5">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-3"><h3 class="text-sm font-semibold text-gray-700">文件列表</h3><span class="text-xs text-gray-400">共 156 项</span></div>

<!-- ==================== SCRIPTS ==================== -->
<script>
// ===== API Configuration =====
const API_BASE = '/api';

async function apiFetch(path, options = {}) {
    try {
        const res = await fetch(API_BASE + path, {
            headers: { 'Content-Type': 'application/json', ...options.headers },
            ...options
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({ error: '请求失败' }));
            throw new Error(err.error || `HTTP ${res.status}`);
        }
        return await res.json();
    } catch (e) {
        showToast(e.message || '网络请求失败', 'error');
        throw e;
    }
}

// ===== Page switching =====
const pageNames = { 'file-storage':'标准文件分类存储', 'file-search':'标准文件精准检索', 'interpret':'标准解读服务', 'faq':'常见问题库' };

function switchPage(pageId, el) {
    document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('breadcrumb-current').textContent = pageNames[pageId] || '';
    document.querySelectorAll('[id^="sub-nav-"]').forEach(n => n.classList.add('hidden'));
    const subNav = document.getElementById('sub-nav-' + pageId);
    if (subNav) subNav.classList.remove('hidden');
}

function switchSub(subId, el, parentPage) {
    const parentEl = document.getElementById('page-' + parentPage);
    parentEl.querySelectorAll('.sub-section').forEach(s => s.classList.remove('active'));
    document.getElementById('sub-' + subId).classList.add('active');
    const subNav = document.getElementById('sub-nav-' + parentPage);
    if (subNav) { subNav.querySelectorAll('.nav-sub-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
}

function switchInterpretTab(tabId, el) {
    document.querySelectorAll('.interpret-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    if (el) { el.closest('.flex').querySelectorAll('.tab-item').forEach(t => t.classList.remove('active')); el.classList.add('active'); }
}
function switchInterpretSub(tabId, el) {
    switchInterpretTab(tabId);
    const subNav = document.getElementById('sub-nav-interpret');
    if (subNav) { subNav.querySelectorAll('.nav-sub-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
}

// ===== Tree toggle =====
function toggleTree(node) {
    const children = node.parentElement.querySelector('.tree-children') || node.nextElementSibling;
    if (!children || !children.classList.contains('tree-children')) return;
    const icon = node.querySelector('.fa-chevron-right, .fa-chevron-down');
    if (!icon) return;
    const isOpen = children.style.maxHeight !== '0px' && children.style.maxHeight !== '0';
    if (isOpen) {
        children.style.maxHeight = '0px'; children.style.opacity = '0';
        icon.classList.remove('fa-chevron-down'); icon.classList.add('fa-chevron-right');
    } else {
        children.style.maxHeight = '500px'; children.style.opacity = '1';
        icon.classList.remove('fa-chevron-right'); icon.classList.add('fa-chevron-down');
    }
}

function expandAllTree() {
    document.querySelectorAll('#fileTree .tree-children').forEach(c => { c.style.maxHeight = '500px'; c.style.opacity = '1'; });
    document.querySelectorAll('#fileTree .fa-chevron-right').forEach(i => { i.classList.remove('fa-chevron-right'); i.classList.add('fa-chevron-down'); });
}

// ===== UI Interactions =====
function togglePreview(card) {
    const panel = card.querySelector('.preview-panel');
    if (panel) panel.classList.toggle('hidden');
}

function toggleArticle(card) {
    const detail = card.querySelector('.article-detail');
    if (detail) detail.classList.toggle('hidden');
    const btn = card.querySelector('button:last-child');
    if (btn) {
        const isHidden = detail && detail.classList.contains('hidden');
        btn.innerHTML = isHidden ? '<i class="fas fa-chevron-down mr-1"></i>展开' : '<i class="fas fa-chevron-up mr-1"></i>收起';
    }
}

function toggleFaq(item) {
    const answer = item.nextElementSibling;
    const icon = item.querySelector('.fa-chevron-down, .fa-chevron-up');
    if (!answer) return;
    const isOpen = answer.style.maxHeight !== '0px' && answer.style.maxHeight !== '0';
    if (isOpen) {
        answer.style.maxHeight = '0px'; answer.style.opacity = '0'; answer.style.padding = '0 20px';
        if (icon) { icon.classList.remove('fa-chevron-up'); icon.classList.add('fa-chevron-down'); }
    } else {
        answer.style.maxHeight = '500px'; answer.style.opacity = '1'; answer.style.padding = '0 20px';
        if (icon) { icon.classList.remove('fa-chevron-down'); icon.classList.add('fa-chevron-up'); }
    }
}

let currentFaqCategory = '';
function switchFaqCat(el, cat) {
    document.querySelectorAll('.faq-cat-btn').forEach(b => { b.className = 'faq-cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition-all'; });
    el.className = 'faq-cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-amber-500 text-white shadow-md transition-all';
    currentFaqCategory = (cat === 'all') ? '' : cat;
    loadFAQs();
}

function selectClause(el) {
    document.querySelectorAll('.clause-item').forEach(c => { c.classList.remove('selected'); c.className = c.className.replace('border-2 border-blue-200 bg-blue-50/50','border border-gray-200'); });
    el.classList.add('selected');
    el.className = el.className.replace('border border-gray-200','border-2 border-blue-200 bg-blue-50/50');
}

// ===== Search =====
function quickSearch(keyword) {
    document.getElementById('searchKeyword').value = keyword;
    performSearch();
}

async function performSearch() {
    const keyword = document.getElementById('searchKeyword').value.trim();
    if (!keyword) { showToast('请输入搜索关键词'); return; }
    try {
        const data = await apiFetch(`/search?keyword=${encodeURIComponent(keyword)}`);
        renderSearchResults(data);
        showToast(`检索完成，共找到 ${data.total} 条结果`);
    } catch (e) { /* error handled in apiFetch */ }
}

function renderSearchResults(data) {
    const container = document.getElementById('searchResultList');
    if (!data.data || data.data.length === 0) {
        container.innerHTML = '<div class="glass-card rounded-xl p-8 text-center"><i class="fas fa-search text-gray-300 text-3xl mb-3"></i><p class="text-sm text-gray-500">未找到匹配的标准文件</p></div>';
        return;
    }
    const catColors = { '国家标准': 'red', '地方标准': 'purple', '行业标准': 'amber' };
    container.innerHTML = data.data.map(f => {
        const color = catColors[f.category_level1] || 'gray';
        const statusCls = f.status === '生效中' ? 'status-active' : f.status === '已废止' ? 'status-expired' : 'status-draft';
        return `<div class="glass-card rounded-xl p-5 cursor-pointer" onclick="togglePreview(this)">
            <div class="flex items-start justify-between"><div class="flex-1">
                <div class="flex items-center gap-2 mb-2">
                    <span class="bg-${color}-50 text-${color}-600 text-[10px] px-2 py-0.5 rounded-full font-medium">${f.category_level1}</span>
                    <span class="${statusCls} text-[10px] px-2 py-0.5 rounded-full">${f.status}</span>
                </div>
                <h4 class="text-sm font-medium text-gray-800 mb-1">${f.code} ${f.name}</h4>
                <p class="text-xs text-gray-500 mb-2">${f.description || ''}</p>
                <div class="flex items-center gap-4 text-[11px] text-gray-400">
                    <span><i class="fas fa-building mr-1"></i>${f.publisher || '-'}</span>
                    <span><i class="fas fa-calendar mr-1"></i>${f.publish_date || '-'}</span>
                    <span><i class="fas fa-tag mr-1"></i>${f.current_version}</span>
                </div>
            </div>
            <button class="ml-4 flex items-center gap-1 text-xs text-blue-600 hover:text-blue-700 whitespace-nowrap border border-blue-200 px-3 py-1.5 rounded-lg hover:bg-blue-50 transition-all" onclick="event.stopPropagation();viewFileDetail(${f.id})"><i class="fas fa-eye"></i> 详情</button>
            </div>
            ${f.content_preview ? `<div class="preview-panel hidden mt-4 pt-4 border-t border-gray-100"><div class="bg-gray-50 rounded-xl p-4"><h5 class="text-xs font-semibold text-gray-600 mb-3"><i class="fas fa-file-lines mr-1"></i> 核心章节预览</h5><div class="text-xs text-gray-600 leading-relaxed whitespace-pre-line">${f.content_preview}</div></div></div>` : ''}
        </div>`;
    }).join('');

    const paginationArea = container.parentElement.querySelector('.flex.items-center.justify-between.mt-6');
    if (paginationArea) {
        paginationArea.querySelector('span').textContent = `显示 1-${data.data.length} / 共 ${data.total} 条`;
    }
}

// ===== Modal =====
function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

// ===== File Detail =====

        const modal = document.getElementById('fileDetailModal');

        const statusCls = file.status === '生效中' ? 'status-active' : file.status === '已废止' ? 'status-expired' : 'status-draft';
        content.innerHTML = `
            <div class="flex items-center gap-3 mb-4"><div class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center"><i class="fas fa-file-pdf text-red-500 text-xl"></i></div><div><h4 class="text-base font-medium text-gray-800">${file.code}</h4><p class="text-sm text-gray-500">${file.name}</p></div></div>
            <div class="grid grid-cols-2 gap-4 bg-gray-50 rounded-xl p-4">
                <div><span class="text-[11px] text-gray-400 block">发布机构</span><span class="text-sm text-gray-700">${file.publisher || '-'}</span></div>
                <div><span class="text-[11px] text-gray-400 block">发布时间</span><span class="text-sm text-gray-700">${file.publish_date || '-'}</span></div>
                <div><span class="text-[11px] text-gray-400 block">当前版本</span><span class="text-sm text-gray-700">${file.current_version}</span></div>
                <div><span class="text-[11px] text-gray-400 block">生效状态</span><span class="${statusCls} text-xs px-2 py-0.5 rounded-full">${file.status}</span></div>
            </div>
            <div><h5 class="text-xs font-semibold text-gray-600 mb-2">文件摘要</h5><p class="text-xs text-gray-600 leading-relaxed">${file.description || '暂无摘要'}</p></div>
            ${file.versions && file.versions.length ? `<div><h5 class="text-xs font-semibold text-gray-600 mb-2">版本历史</h5><div class="space-y-1">${file.versions.map(v => `<div class="flex items-center gap-2 text-xs p-2 rounded-lg hover:bg-gray-50"><span class="font-medium text-blue-600">${v.version}</span><span class="text-gray-500">${v.change_log || ''}</span><span class="ml-auto text-gray-400">${v.publish_date || ''}</span></div>`).join('')}</div></div>` : ''}
            ${file.relations && file.relations.length ? `<div><h5 class="text-xs font-semibold text-gray-600 mb-2">关联材料</h5><div class="space-y-2">${file.relations.map(r => `<div class="flex items-center gap-2 text-xs text-gray-600 p-2 rounded-lg hover:bg-gray-50"><i class="fas fa-link text-blue-400"></i><span>${r.targetFile ? r.targetFile.name : ''}</span><span class="tag bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full text-[10px]">${r.relation_type}</span></div>`).join('')}</div></div>` : ''}
            ${file.interpretations && file.interpretations.length ? `<div><h5 class="text-xs font-semibold text-gray-600 mb-2">解读内容</h5><div class="space-y-2">${file.interpretations.map(i => `<div class="flex items-center gap-2 text-xs text-gray-600 p-2 rounded-lg hover:bg-gray-50"><i class="fas fa-${i.type === 'video' ? 'video text-blue-400' : 'newspaper text-emerald-400'}"></i><span>${i.title}</span></div>`).join('')}</div></div>` : ''}`;
        openModal('fileDetailModal');
    } catch (e) { /* handled */ }
}

// ===== Upload File =====
async function submitUploadFile() {
    const modal = document.getElementById('uploadModal');
    const inputs = modal.querySelectorAll('input, select');
    const code = inputs[0].value.trim();
    const name = inputs[1].value.trim();
    const category_level1 = inputs[2].value;
    const publish_date = inputs[3].value;
    const publisher = inputs[4].value.trim();
    if (!code || !name) { showToast('请填写文件编号和名称'); return; }
    try {
        await apiFetch('/files', {
            method: 'POST',
            body: JSON.stringify({ code, name, category_level1, publish_date: publish_date || null, publisher })
        });
        showToast('文件上传成功');
        closeModal('uploadModal');
        loadStats(); loadTree();
    } catch (e) { /* handled */ }
}

// ===== Upload Video =====
async function submitUploadVideo() {
    const modal = document.getElementById('videoUploadModal');
    const inputs = modal.querySelectorAll('input, select');
    const title = inputs[0].value.trim();
    if (!title) { showToast('请填写视频标题'); return; }
    try {
        await apiFetch('/interpretations', {
            method: 'POST',
            body: JSON.stringify({ title, type: 'video', expert_name: inputs[3]?.value || '' })
        });
        showToast('视频上传成功');
        closeModal('videoUploadModal');
        loadInterpretations();
    } catch (e) { /* handled */ }
}

// ===== Video play/pause =====
let isPlaying = false;
function togglePlayPause() {
    isPlaying = !isPlaying;
    const icon = document.getElementById('playIcon');
    const progress = document.getElementById('videoProgress');
    if (isPlaying) {
        icon.classList.remove('fa-play'); icon.classList.add('fa-pause'); icon.style.marginLeft = '0';
        let w = 0;
        window._videoInterval = setInterval(() => { w += 0.2; if (w > 100) { w = 0; togglePlayPause(); } progress.style.width = w + '%'; }, 100);
    } else {
        icon.classList.remove('fa-pause'); icon.classList.add('fa-play'); icon.style.marginLeft = '4px';
        clearInterval(window._videoInterval);
    }
}

// ===== Toast =====
function showToast(msg, type) {
    const t = document.getElementById('toast');
    const icon = t.querySelector('i');
    const msgEl = document.getElementById('toastMsg');
    msgEl.textContent = msg;
    if (type === 'error') { icon.className = 'fas fa-exclamation-circle text-red-500'; }
    else { icon.className = 'fas fa-check-circle text-emerald-500'; }
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 2500);
}

// ===== API Data Loading =====
async function loadStats() {
    try {
        const stats = await apiFetch('/files/stats');
        const cards = document.querySelectorAll('#page-file-storage .grid.grid-cols-4 .glass-card');
        if (cards[0]) cards[0].querySelector('.text-2xl').textContent = stats.total.toLocaleString();
        if (cards[1]) cards[1].querySelector('.text-2xl').textContent = stats.national.toLocaleString();
        if (cards[2]) cards[2].querySelector('.text-2xl').textContent = stats.local.toLocaleString();
        if (cards[3]) cards[3].querySelector('.text-2xl').textContent = stats.industry.toLocaleString();
    } catch (e) { /* use static fallback */ }
}

async function loadTree() {
    try {
        const tree = await apiFetch('/files/tree');
        const container = document.getElementById('fileTree');
        const iconMap = { '国家标准': { icon: 'fa-landmark', color: 'red', bg: 'blue' }, '地方标准': { icon: 'fa-map', color: 'purple', bg: 'purple' }, '行业标准': { icon: 'fa-industry', color: 'amber', bg: 'amber' } };
        container.innerHTML = tree.map((l1, idx) => {
            const ic = iconMap[l1.name] || { icon: 'fa-folder', color: 'gray', bg: 'gray' };
            const isFirst = idx === 0;
            return `<div>
                <div class="tree-node flex items-center gap-2 px-3 py-2 rounded-lg ${isFirst ? 'bg-blue-50/50' : ''}" onclick="toggleTree(this)">
                    <i class="fas ${isFirst ? 'fa-chevron-down' : 'fa-chevron-right'} text-[10px] text-${ic.bg}-400 transition-transform duration-200 w-3"></i>
                    <i class="fas ${ic.icon} text-${ic.color}-400 text-sm"></i>
                    <span class="text-sm font-medium text-gray-700">${l1.name}</span>
                    <span class="ml-auto text-[11px] bg-${ic.bg}-100 text-${ic.bg}-700 px-2 py-0.5 rounded-full">${l1.count}</span>
                </div>
                <div class="tree-children pl-5 mt-1 space-y-0.5" style="max-height:${isFirst ? '500px' : '0px'};opacity:${isFirst ? '1' : '0'}${isFirst ? '' : ';overflow:hidden'}">
                    ${l1.children.map(l2 => `<div>
                        <div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg" onclick="toggleTree(this)">
                            <i class="fas fa-chevron-right text-[10px] text-gray-400 transition-transform duration-200 w-3"></i>
                            <i class="fas fa-folder text-${ic.bg}-400 text-xs"></i>
                            <span class="text-[13px] text-gray-600">${l2.name}</span>
                            <span class="ml-auto text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full">${l2.count}</span>
                        </div>
                        <div class="tree-children pl-5 space-y-0.5" style="max-height:0;opacity:0;overflow:hidden">
                            ${l2.files.map(f => `<div class="tree-node flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-blue-50 cursor-pointer" onclick="event.stopPropagation();viewFileDetail(${f.id})">
                                <i class="fas fa-file-pdf text-red-400 text-xs w-3"></i>
                                <span class="text-xs text-gray-600 truncate">${f.code} ${f.name}</span>
                            </div>`).join('')}
                        </div>
                    </div>`).join('')}
                </div>
            </div>`;
        }).join('');
    } catch (e) { /* use static fallback */ }
}

async function loadFileList(category, page) {
    try {
        const params = new URLSearchParams({ page: page || 1, pageSize: 5 });
        if (category) params.set('category', category);
        const data = await apiFetch(`/files?${params}`);
        const tbody = document.querySelector('#sub-tree-view .data-table tbody');
        if (!tbody) return;
        tbody.innerHTML = data.data.map(f => {
            const statusCls = f.status === '生效中' ? 'status-active' : f.status === '已废止' ? 'status-expired' : 'status-draft';
            return `<tr class="cursor-pointer" onclick="viewFileDetail(${f.id})">
                <td class="px-4 py-3 text-xs text-blue-600 font-medium">${f.code}</td>
                <td class="px-4 py-3 text-xs text-gray-700">${f.name}</td>
                <td class="px-4 py-3 text-xs text-gray-500">${f.publish_date || '-'}</td>
                <td class="px-4 py-3"><span class="${statusCls} text-[10px] px-2 py-0.5 rounded-full font-medium">${f.status}</span></td>
                <td class="px-4 py-3 text-xs text-gray-500">${f.current_version}</td>
                <td class="px-4 py-3 text-right"><div class="flex items-center justify-end gap-1">
                    <button class="w-7 h-7 rounded-lg hover:bg-blue-50 flex items-center justify-center text-gray-400 hover:text-blue-500 transition-all" title="预览" onclick="event.stopPropagation();viewFileDetail(${f.id})"><i class="fas fa-eye text-xs"></i></button>
                    <button class="w-7 h-7 rounded-lg hover:bg-blue-50 flex items-center justify-center text-gray-400 hover:text-blue-500 transition-all" title="下载"><i class="fas fa-download text-xs"></i></button>
                    <button class="w-7 h-7 rounded-lg hover:bg-blue-50 flex items-center justify-center text-gray-400 hover:text-blue-500 transition-all" title="关联"><i class="fas fa-link text-xs"></i></button>
                </div></td>
            </tr>`;
        }).join('');
        const info = document.querySelector('#sub-tree-view .flex.items-center.justify-between.mt-4 span');
        if (info) info.textContent = `显示 1-${data.data.length} / 共 ${data.total} 条`;
    } catch (e) { /* use static fallback */ }
}

async function loadFAQs() {
    try {
        const catMap = { '标准理解类': '标准理解类', '申报操作类': '申报操作类', '评估执行类': '评估执行类', '使用帮助类': '使用操作类' };
        const params = new URLSearchParams({ pageSize: 20 });
        if (currentFaqCategory) {
            const mapped = catMap[currentFaqCategory] || currentFaqCategory;
            params.set('category', mapped);
        }
        const data = await apiFetch(`/faqs?${params}`);
        const container = document.querySelector('#page-faq .space-y-3');
        if (!container) return;
        const catColorMap = { '标准理解类': 'blue', '申报操作类': 'emerald', '评估执行类': 'purple', '使用操作类': 'amber' };
        container.innerHTML = data.data.map(faq => {
            const color = catColorMap[faq.category] || 'gray';
            return `<div class="glass-card rounded-xl overflow-hidden">
                <div class="faq-item px-5 py-4 cursor-pointer flex items-center justify-between" onclick="toggleFaq(this)">
                    <div class="flex items-center gap-3">
                        <span class="bg-${color}-50 text-${color}-600 text-[10px] px-2 py-0.5 rounded-full font-medium whitespace-nowrap">${faq.category}</span>
                        <span class="text-sm text-gray-800">${faq.question}</span>
                    </div>
                    <i class="fas fa-chevron-down text-gray-400 text-xs transition-transform duration-200"></i>
                </div>
                <div class="faq-answer" style="max-height:0;opacity:0;overflow:hidden;padding:0 20px">
                    <div class="pb-4">
                        <div class="mb-3"><h5 class="text-xs font-semibold text-gray-600 mb-2">解答要点</h5>
                        <p class="text-xs text-gray-600 leading-relaxed">${faq.answer.replace(/\n/g, '<br>')}</p></div>
                        ${faq.related_standard ? `<div class="flex items-center gap-4 text-[11px]"><span class="text-gray-400"><i class="fas fa-link mr-1"></i>关联标准：<a class="text-blue-600 hover:underline cursor-pointer">${faq.related_standard}</a></span></div>` : ''}
                        <div class="flex items-center gap-2 mt-2"><button class="text-[11px] text-gray-400 hover:text-blue-600 transition-all" onclick="event.stopPropagation();markFaqHelpful(${faq.id},this)"><i class="fas fa-thumbs-up mr-1"></i>有帮助 (${faq.helpful_count})</button></div>
                    </div>
                </div>
            </div>`;
        }).join('');
        const pInfo = document.querySelector('#page-faq .flex.items-center.justify-between.mt-6 span');
        if (pInfo) pInfo.textContent = `显示 1-${data.data.length} / 共 ${data.total} 条`;
    } catch (e) { /* use static fallback */ }
}

async function markFaqHelpful(id, btn) {
    try {
        await apiFetch(`/faqs/${id}/helpful`, { method: 'POST' });
        const countMatch = btn.textContent.match(/\((\d+)\)/);
        if (countMatch) {
            const newCount = parseInt(countMatch[1]) + 1;
            btn.innerHTML = `<i class="fas fa-thumbs-up mr-1"></i>有帮助 (${newCount})`;
        }
        showToast('感谢您的反馈');
    } catch (e) { /* handled */ }
}

async function loadInterpretations() {
    try {
        const [videos, articles] = await Promise.all([
            apiFetch('/interpretations?type=video&pageSize=50'),
            apiFetch('/interpretations?type=article&pageSize=50')
        ]);
        // Render is handled by static HTML for visual richness; update count
        const videoCount = document.querySelector('#tab-video .text-sm span, #tab-video strong');
        if (videoCount) videoCount.textContent = videos.total;
        const articleCount = document.querySelector('#tab-article strong');
        if (articleCount) articleCount.textContent = articles.total;
    } catch (e) { /* use static fallback */ }
}

// ===== Global Search =====
async function globalSearch() {
    const input = document.querySelector('header input[type="text"]');
    const q = input ? input.value.trim() : '';
    if (!q) return;
    try {
        const data = await apiFetch(`/search/global?q=${encodeURIComponent(q)}`);
        const total = (data.files?.length || 0) + (data.interpretations?.length || 0) + (data.faqs?.length || 0);
        showToast(`找到 ${total} 条相关结果`);
        if (data.files && data.files.length > 0) {
            switchPage('file-search', document.querySelector('[data-page="file-search"]'));
            document.getElementById('searchKeyword').value = q;
            renderSearchResults({ total: data.files.length, data: data.files });
        }
    } catch (e) { /* handled */ }
}

// ===== Initialize =====
document.addEventListener('DOMContentLoaded', () => {
    // Wire up global search
    const headerInput = document.querySelector('header input[type="text"]');
    if (headerInput) headerInput.addEventListener('keyup', e => { if (e.key === 'Enter') globalSearch(); });

    // Wire up upload buttons
    const uploadBtn = document.querySelector('#uploadModal .btn-primary');
    if (uploadBtn) uploadBtn.onclick = submitUploadFile;
    const videoUploadBtn = document.querySelector('#videoUploadModal .btn-primary');
    if (videoUploadBtn) videoUploadBtn.onclick = submitUploadVideo;

    // Load data from API
    loadStats();
    loadTree();
    loadFileList();
    loadFAQs();
    loadInterpretations();
});
</script>
